# Runtime application manager configuration.
application_scan_interval_ms=1000
worker_count=2
application_monitor_interval_ms=100
max_pending_jobs=16
application_idle_timeout=2
include_root_processes=false
# Phase 4A remains opt-in. The runtime creates a 0600 SOCK_SEQPACKET socket under its root.
page_registration_enabled=false
page_registration_ttl_ms=30000
